# NetPulse — network-focused theme: wi-fi signal, transfer rates, ping stability, totals
# Requires the BatteryLevel, CurrentUser, OsName and WifiSignal custom sensors in library/sensors/sensors_custom.py
# NET.WLO follows the WLO interface from config.yaml; ping target follows PING from config.yaml
---
author: "Casey Hartman"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 45, 212, 191

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

STATS:
  NET:
    INTERVAL: 1
    WLO:
      DOWNLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 11
          X: 38
          Y: 208
          FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
          FONT_SIZE: 28
          FONT_COLOR: 232, 240, 243
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
        LINE_GRAPH:
          SHOW: True
          X: 30
          Y: 232
          WIDTH: 260
          HEIGHT: 50
          MIN_VALUE: 0
          MAX_VALUE: 100000000
          AUTOSCALE: True
          LINE_COLOR: 45, 212, 191
          LINE_WIDTH: 2
          AXIS: False
          BACKGROUND_IMAGE: background.png
      UPLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 11
          X: 38
          Y: 336
          FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
          FONT_SIZE: 20
          FONT_COLOR: 232, 240, 243
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
      UPLOADED:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 7
          X: 54
          Y: 434
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 14
          FONT_COLOR: 232, 240, 243
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
      DOWNLOADED:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 7
          X: 148
          Y: 434
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 14
          FONT_COLOR: 232, 240, 243
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
  PING:
    INTERVAL: 5
    TEXT:
      SHOW: True
      MIN_SIZE: 3
      UNIT: " ms"
      X: 186
      Y: 336
      FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
      FONT_SIZE: 22
      FONT_COLOR: 232, 240, 243
      BACKGROUND_IMAGE: background.png
      ANCHOR: lm
    GRAPH:
      SHOW: False
    RADIAL:
      SHOW: False
    LINE_GRAPH:
      SHOW: True
      X: 30
      Y: 362
      WIDTH: 260
      HEIGHT: 42
      MIN_VALUE: 0
      MAX_VALUE: 500
      AUTOSCALE: True
      LINE_COLOR: 45, 212, 191
      LINE_WIDTH: 2
      AXIS: False
      BACKGROUND_IMAGE: background.png
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        X: 290
        Y: 464
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 232, 240, 243
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    DAY:
      TEXT:
        SHOW: True
        FORMAT: "EEE, MMM d"
        X: 36
        Y: 464
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 100, 150, 164
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  CUSTOM:
    INTERVAL: 5
    CurrentUser:
      TEXT:
        SHOW: True
        X: 16
        Y: 25
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 100, 150, 164
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    OsName:
      TEXT:
        SHOW: True
        X: 160
        Y: 25
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 232, 240, 243
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    BatteryLevel:
      TEXT:
        SHOW: True
        X: 304
        Y: 25
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 11
        FONT_COLOR: 232, 240, 243
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    Timezone:
      TEXT:
        SHOW: True
        X: 130
        Y: 464
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 100, 150, 164
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    WifiSignal:
      TEXT:
        SHOW: True
        X: 38
        Y: 106
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 28
        FONT_COLOR: 232, 240, 243
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
      GRAPH:
        SHOW: True
        X: 30
        Y: 130
        WIDTH: 260
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 45, 212, 191
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
