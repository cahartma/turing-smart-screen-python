# Aurora Landscape — 480x320 landscape variant of Aurora
# Requires the BatteryLevel and CurrentUser custom sensors in library/sensors/sensors_custom.py
---
author: "Casey Hartman"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 81, 162, 218

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 2
      RADIAL:
        SHOW: True
        X: 86
        Y: 108
        RADIUS: 44
        WIDTH: 9
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 135
        ANGLE_END: 45
        ANGLE_STEPS: 27
        ANGLE_SEP: 2
        CLOCKWISE: True
        DRAW_BAR_BACKGROUND: True
        BAR_BACKGROUND_COLOR: 40, 74, 110
        BAR_COLOR: 81, 162, 218
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        FAHRENHEIT: True
        X: 140
        Y: 94
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    FAN_SPEED:
      INTERVAL: 5
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 140
        Y: 142
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      USED:
        SHOW: True
        SHOW_UNIT: True
        X: 258
        Y: 112
        MIN_SIZE: 1
        SCALE: 1024
        DECIMALS: 2
        UNIT: " GB"
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 28
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 450
        Y: 84
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: ra
      TOTAL:
        SHOW: True
        SHOW_UNIT: True
        X: 450
        Y: 118
        MIN_SIZE: 3
        SCALE: 1024
        DECIMALS: 1
        UNIT: " GB"
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: ra
      GRAPH:
        SHOW: True
        X: 250
        Y: 140
        WIDTH: 200
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 81, 162, 218
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
  DISK:
    INTERVAL: 10
    USED:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        X: 38
        Y: 248
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 28
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 210
        Y: 244
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: ra
      GRAPH:
        SHOW: True
        X: 30
        Y: 270
        WIDTH: 180
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 81, 162, 218
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
    TOTAL:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 210
        Y: 222
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: ra
  NET:
    INTERVAL: 1
    WLO:
      DOWNLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 1
          X: 258
          Y: 214
          FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
          FONT_SIZE: 16
          FONT_COLOR: 232, 238, 246
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
        LINE_GRAPH:
          SHOW: True
          X: 250
          Y: 240
          WIDTH: 200
          HEIGHT: 46
          MIN_VALUE: 0
          MAX_VALUE: 100000000
          AUTOSCALE: True
          LINE_COLOR: 81, 162, 218
          LINE_WIDTH: 2
          AXIS: False
          BACKGROUND_IMAGE: background.png
      UPLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 1
          X: 358
          Y: 214
          FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
          FONT_SIZE: 16
          FONT_COLOR: 232, 238, 246
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        X: 464
        Y: 308
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 12
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
  CUSTOM:
    INTERVAL: 5
    CurrentUser:
      TEXT:
        SHOW: True
        X: 16
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    OsName:
      TEXT:
        SHOW: True
        X: 240
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    BatteryLevel:
      TEXT:
        SHOW: True
        X: 464
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 11
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    FanRpm:
      TEXT:
        SHOW: True
        X: 140
        Y: 142
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 232, 238, 246
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm

    CpuTempCelsius:
      TEXT:
        SHOW: True
        X: 198
        Y: 94
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 10
        FONT_COLOR: 129, 190, 240
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
