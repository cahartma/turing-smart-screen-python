# JetHUDLandscape — fighter-jet HUD in 480x320: heading tape, radar scope, data blocks
# Requires the BatteryLevel, CurrentUser, OsName, FanRpm and WifiSignal custom sensors
# in library/sensors/sensors_custom.py
---
author: "Casey Hartman"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 255, 120

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 2
      RADIAL:
        SHOW: True
        X: 240
        Y: 190
        RADIUS: 70
        WIDTH: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 135
        ANGLE_END: 45
        ANGLE_STEPS: 30
        ANGLE_SEP: 2
        CLOCKWISE: True
        DRAW_BAR_BACKGROUND: True
        BAR_BACKGROUND_COLOR: 20, 80, 50
        BAR_COLOR: 0, 255, 120
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        FAHRENHEIT: True
        X: 240
        Y: 50
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    FAN_SPEED:
      INTERVAL: 5
      TEXT:
        SHOW: False
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        X: 70
        Y: 166
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
  DISK:
    INTERVAL: 10
    USED:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        X: 70
        Y: 258
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
  NET:
    INTERVAL: 2
    WLO:
      DOWNLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 152
          Y: 304
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 11
          FONT_COLOR: 60, 130, 85
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
      UPLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 302
          Y: 304
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 11
          FONT_COLOR: 60, 130, 85
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        X: 464
        Y: 304
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    DAY:
      TEXT:
        SHOW: True
        FORMAT: "EEE, MMM d"
        X: 16
        Y: 304
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 60, 130, 85
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  CUSTOM:
    INTERVAL: 5
    CurrentUser:
      TEXT:
        SHOW: True
        X: 16
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 60, 130, 85
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    OsName:
      TEXT:
        SHOW: True
        X: 240
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 60, 130, 85
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    BatteryLevel:
      TEXT:
        SHOW: True
        X: 464
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    FanRpm:
      TEXT:
        SHOW: True
        X: 410
        Y: 166
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 14
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    WifiSignal:
      TEXT:
        SHOW: True
        X: 410
        Y: 258
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 14
        FONT_COLOR: 200, 255, 220
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
