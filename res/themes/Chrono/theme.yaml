# Chrono — watch face, packed efficiently: main dial, complication strip, subdials, date aperture
# Requires the BatteryLevel, CurrentUser, OsName, FanRpm, WifiSignal and CpuTempCelsius
# custom sensors in library/sensors/sensors_custom.py
---
author: "Casey Hartman"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 120, 180, 255

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 2
      RADIAL:
        SHOW: True
        X: 160
        Y: 140
        RADIUS: 58
        WIDTH: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 135
        ANGLE_END: 45
        ANGLE_STEPS: 30
        ANGLE_SEP: 2
        CLOCKWISE: True
        DRAW_BAR_BACKGROUND: True
        BAR_BACKGROUND_COLOR: 36, 56, 86
        BAR_COLOR: 120, 180, 255
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        FAHRENHEIT: True
        X: 34
        Y: 244
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    FAN_SPEED:
      INTERVAL: 5
      TEXT:
        SHOW: False
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      RADIAL:
        SHOW: True
        X: 72
        Y: 330
        RADIUS: 40
        WIDTH: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 135
        ANGLE_END: 45
        ANGLE_STEPS: 24
        ANGLE_SEP: 2
        CLOCKWISE: True
        DRAW_BAR_BACKGROUND: True
        BAR_BACKGROUND_COLOR: 36, 56, 86
        BAR_COLOR: 120, 180, 255
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
      USED:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        SCALE: 1024
        DECIMALS: 1
        UNIT: " GB"
        X: 72
        Y: 398
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 10
        FONT_COLOR: 150, 175, 210
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
      TOTAL:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 3
        SCALE: 1024
        DECIMALS: 1
        UNIT: " GB"
        X: 72
        Y: 420
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 9
        FONT_COLOR: 115, 128, 148
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
  DISK:
    INTERVAL: 10
    USED:
      RADIAL:
        SHOW: True
        X: 248
        Y: 330
        RADIUS: 40
        WIDTH: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 135
        ANGLE_END: 45
        ANGLE_STEPS: 24
        ANGLE_SEP: 2
        CLOCKWISE: True
        DRAW_BAR_BACKGROUND: True
        BAR_BACKGROUND_COLOR: 36, 56, 86
        BAR_COLOR: 120, 180, 255
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        X: 248
        Y: 398
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 10
        FONT_COLOR: 150, 175, 210
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    TOTAL:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 248
        Y: 420
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 9
        FONT_COLOR: 115, 128, 148
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
  NET:
    INTERVAL: 2
    WLO:
      DOWNLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 16
          Y: 466
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 12
          FONT_COLOR: 150, 175, 210
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
      UPLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 140
          Y: 466
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 12
          FONT_COLOR: 150, 175, 210
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        SHOW: True
        FORMAT: "EEE d"
        X: 160
        Y: 330
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    HOUR:
      TEXT:
        SHOW: True
        X: 304
        Y: 466
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
  CUSTOM:
    INTERVAL: 5
    CurrentUser:
      TEXT:
        SHOW: True
        X: 16
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 150, 175, 210
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    OsName:
      TEXT:
        SHOW: True
        X: 160
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 150, 175, 210
        BACKGROUND_IMAGE: background.png
        ANCHOR: mm
    BatteryLevel:
      TEXT:
        SHOW: True
        X: 304
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 11
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    FanRpm:
      TEXT:
        SHOW: True
        X: 132
        Y: 244
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    WifiSignal:
      TEXT:
        SHOW: True
        X: 222
        Y: 244
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 225, 232, 242
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    CpuTempCelsius:
      TEXT:
        SHOW: True
        X: 77
        Y: 245
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 9
        FONT_COLOR: 115, 128, 148
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
