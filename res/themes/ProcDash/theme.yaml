# ProcDash — top-processes dashboard: ps-style rows, summary, CPU/MEM history
# Requires the BatteryLevel, CurrentUser, OsName, Timezone, TopProc1-5 and
# ProcessCount custom sensors in library/sensors/sensors_custom.py
---
author: "Casey Hartman"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 0, 255, 140

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        MIN_SIZE: 1
        X: 160
        Y: 352
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 190, 235, 205
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 250
        Y: 352
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 190, 235, 205
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  NET:
    INTERVAL: 2
    WLO:
      DOWNLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 70
          Y: 416
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 13
          FONT_COLOR: 190, 235, 205
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
      UPLOAD:
        TEXT:
          SHOW: True
          SHOW_UNIT: True
          MIN_SIZE: 10
          X: 210
          Y: 416
          FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
          FONT_SIZE: 13
          FONT_COLOR: 190, 235, 205
          BACKGROUND_IMAGE: background.png
          ANCHOR: lm
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        X: 304
        Y: 462
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 190, 235, 205
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    DAY:
      TEXT:
        SHOW: True
        FORMAT: "EEE, MMM d"
        X: 16
        Y: 462
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 140, 190, 155
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
  CUSTOM:
    INTERVAL: 2
    CurrentUser:
      TEXT:
        SHOW: True
        X: 16
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 140, 190, 155
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    OsName:
      TEXT:
        SHOW: True
        X: 130
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 140, 190, 155
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    BatteryLevel:
      TEXT:
        SHOW: True
        X: 304
        Y: 18
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 11
        FONT_COLOR: 190, 235, 205
        BACKGROUND_IMAGE: background.png
        ANCHOR: rm
    Timezone:
      TEXT:
        SHOW: True
        X: 105
        Y: 462
        FONT: jetbrains-mono/JetBrainsMono-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 140, 190, 155
        BACKGROUND_IMAGE: background.png
        ANCHOR: lm
    ProcessCount:
